name: Bug report
description: Something in herdr-relay does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, do not file an issue: report it privately (see SECURITY.md).
        Before pasting logs, remove your user name, home path, tailnet host name and any tokens.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. herdr-relay start
        2. Open the Files tab on the phone
        3. …
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: herdr-relay doctor
      description: The output of `herdr-relay doctor`.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: herdr-relay version or commit
      placeholder: 0.1.0, or the output of git rev-parse --short HEAD
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPad Air, iPadOS 26, Safari (installed to Home Screen)
  - type: input
    id: mods
    attributes:
      label: Layout and mods involved
      placeholder: Herdr's main layout; the files mod
  - type: textarea
    id: logs
    attributes:
      label: Bridge log
      description: The relevant `herdr-relay:` lines from the terminal or ~/Library/Logs/herdr-relay.log.
      render: text
