# CI (docs/OSS-PLAN.md §7.4, T43). macOS is the only v1 platform (decision O2): every job that runs herdr-relay runs on
# macOS; ubuntu runs only the platform-neutral checks (format, lint, types, scrub) and the secret scan.
#
# Not run here: `deno task test:core` (needs a live herdr-core), the tools/device-tests Playwright runs (they need a
# running `start:dev` with a fake core, docs/DESIGN-v2.md §5.2), the bubblewrap security rows (T39, after v1), real
# Tailscale and Web Push.
#
# Caches: Deno's default DENO_DIR, keyed on deno.lock; the fetched fonts, keyed on their manifest.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/deno' || '~/.cache/deno' }}
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-
      - run: deno install --frozen
      - run: deno task check
      - run: deno task scrub:check

  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-
      - run: deno install --frozen
      - run: deno task test
      - run: deno task check:modhost
      - id: fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/web/public/fonts
          key: fonts-${{ hashFiles('packages/web/**/fonts.manifest.json') }}
      - if: steps.fonts.outputs.cache-hit != 'true'
        run: deno task --cwd packages/web fonts
      # `deno task bundle`, then the release tarball exactly as release.yml builds it, without a tag.
      - run: deno task release:dry

  security:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-
      - run: deno install --frozen
      - run: deno task test:security
      # The Seatbelt profile was derived on one macOS and one Deno (seatbelt.template.sb header). On the runner's macOS
      # its check (docs/INSTALL.md §8) reports drift as a warning and a report artifact, not a failure.
      - name: Seatbelt derivation check
        if: ${{ !cancelled() }}
        run: |
          version=$(sw_vers -productVersion)
          if deno run --allow-read --allow-write --allow-net=127.0.0.1 --allow-env --allow-run=deno,sandbox-exec \
            packages/bridge/scripts/seatbelt-derive.ts > "$RUNNER_TEMP/seatbelt-derive.json"; then
            echo "The Seatbelt profile holds on macOS $version."
          else
            echo "::warning title=Seatbelt drift::seatbelt-derive.ts failed on macOS $version; see the seatbelt-derive artifact."
          fi
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seatbelt-derive
          path: ${{ runner.temp }}/seatbelt-derive.json
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
