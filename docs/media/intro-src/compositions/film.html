      position: relative;

    }

      top: 50%;
      margin: -0.6em 0 0 0;
    }
    .rl-term .ss-term__caret {
      height: 1.25em;
    }

    /* The iPad: 1180 x 820 pt landscape, black glass, its own status bar */
    #ipad { z-index: 3; }
    .rl-ipad {
      width: 1216px;
      height: 856px;
      padding: 18px;
      border-radius: 38px;
      background: #0d0d0f;

      width: 1180px;
      height: 820px;
      overflow: hidden;
      border-radius: 20px;
      background: #1c1c1f;
    }
    .rl-fill {
      position: absolute;
      left: 0;
      top: 0;
      width: 1180px;
      height: 820px;
      display: block;
    }
    .rl-ipad__status {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 24px;
      padding: 0 20px 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      font: 600 13px/1 -apple-system, "SF Pro Text", system-ui, sans-serif;
      letter-spacing: 0.1px;

    .rl-ipad__status .rl-day { font-weight: 500; margin-left: 7px; }
    .rl-ipad__glyphs { display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: 12px; }
    .rl-ipad__glyphs svg { display: block; fill: currentColor; height: 11px; width: auto; }

    /* A finger on glass: a soft dot only while it touches (the kit's touch cursor, lightened for a dark screen) */
    #touch {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      z-index: 4;
    }
    #touch-dot {
      position: absolute;
      left: -24px;
      top: -24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(240, 242, 248, 0.36);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.24), 0 2px 10px rgba(0, 0, 0, 0.25);
      opacity: 0;
    }

    /* The phone: the kit's iPhone (402 x 874 pt), the device app's own screen under its status bar */
    #phone { z-index: 4; }
    #phone .ss-phone {
      filter: drop-shadow(0 30px 40px rgba(24, 27, 33, 0.30)) drop-shadow(0 10px 16px rgba(24, 27, 33, 0.20));
    }
    #phone .ss-phone__screen {
      background: #1e1e21;
    }
    .rl-phone-shot {
      position: absolute;
      left: 0;
      top: 0;
      width: 402px;
      height: 874px;
      display: block;
    }

    /* The kit's own CSS transitions (window recede, status bar color) never fire here; hold them off so every
       frame is a function of the timeline alone */
    #world,
    #world * {
      transition: none !important;
    }

  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      // Poses (film px; each device is placed by its top-left corner). The group keeps 192 px gutters at the
      // sides, the titles' left edge.
      const MAC_S1 = { x: 192, y: 264, scale: 1.0667 };
      const MAC = { x: 192, y: 214, scale: 0.75 };
      const TERM = { x: 600, y: 430, scale: 2.35 };
      const IPAD = { x: 974, y: 590, scale: 0.62 };
      const IPAD_FWD = { x: 192, y: 214, scale: 1.2632 };
      const PHONE = { x: 1463, y: 214, scale: 0.62 };
      const END = { x: 288, y: 370, scale: 0.7 };
      const OFF_RIGHT = 2000;
      const OFF_BOTTOM = 1180;
      // The real drag clip: frame 1 is the press, frames 2-28 the eased drag (268 -> 380 px), frame 33 the release
      const CLIP = 10.4;
      const FRAME = 1 / 30;

      // Opening states, set at once (a zero-length set at 0 on the paused timeline would not draw frame 0)
      gsap.set(".rl-dev", { transformOrigin: "0 0" });
      gsap.set("#world", { x: 0, y: 0, scale: 1 });
      gsap.set("#mac", MAC_S1);
      gsap.set("#term", { x: TERM.x, y: OFF_BOTTOM, scale: TERM.scale });
      gsap.set("#ipad", { x: OFF_RIGHT, y: IPAD.y, scale: IPAD.scale });
      gsap.set("#phone", { x: OFF_RIGHT + 120, y: PHONE.y, scale: PHONE.scale });
      gsap.set("#term-cmd", { clipPath: "inset(0 100% 0 0)" });
      gsap.set("#term-caret-a", { x: 0, opacity: 1 });
      gsap.set("#term-caret-b", { opacity: 0 });
      gsap.set(["#term-o1", "#term-o2", "#term-o3", "#term-o4", "#term-o5", "#term-o6"], { opacity: 0 });
      gsap.set("#touch", { x: 268, y: 350 });
      gsap.set("#touch-dot", { opacity: 0, scale: 0.7 });

      // S2: the Mac steps back, the bridge starts beside it
      tl.to("#mac", { ...MAC, duration: 0.8, ease: "power2.inOut" }, 2.45);
      tl.to("#term", { y: TERM.y, duration: 0.9, ease: "expo.out" }, 2.75);
      tl.to("#term-cmd", { clipPath: "inset(0 0% 0 0)", duration: 0.42, ease: "steps(17)" }, 3.35);
      tl.to("#term-caret-a", { x: 17 * 7.2, duration: 0.42, ease: "steps(17)" }, 3.35);
      tl.set("#term-caret-a", { opacity: 0 }, 3.85);
      tl.to(["#term-o1", "#term-o2", "#term-o3", "#term-o4", "#term-o5", "#term-o6"], { opacity: 1, duration: 0.05, ease: "none", stagger: 0.09 }, 3.88);
      tl.set("#term-caret-b", { opacity: 1 }, 4.4);

      // S3: the terminal leaves, the iPad and the phone arrive with the same layout
      tl.to("#term", { y: OFF_BOTTOM, duration: 0.45, ease: "power3.in" }, 6.1);
      tl.to("#ipad", { x: IPAD.x, duration: 0.9, ease: "expo.out" }, 6.3);
      tl.to("#phone", { x: PHONE.x, duration: 0.9, ease: "expo.out" }, 6.45);

      // S4a: the iPad comes forward over the Mac; a finger drags its sidebar edge (the real frames play in the screen)
      tl.to("#phone", { x: OFF_RIGHT + 120, duration: 0.35, ease: "power3.in" }, 9.25);
      tl.to("#ipad", { ...IPAD_FWD, duration: 0.7, ease: "power2.inOut" }, 9.45);
      tl.to("#touch-dot", { opacity: 1, scale: 1, duration: 0.15, ease: "power2.out" }, CLIP + FRAME - 0.15);
      tl.to("#touch-dot", { scale: 0.82, duration: 0.1, ease: "power1.out" }, CLIP + FRAME);
      tl.to("#touch", { x: 380, duration: 27 * FRAME, ease: "power2.inOut" }, CLIP + FRAME);
      tl.to("#touch-dot", { scale: 1, duration: 0.12, ease: "power1.out" }, CLIP + 33 * FRAME);
      tl.to("#touch-dot", { opacity: 0, duration: 0.4, ease: "power1.out" }, CLIP + 33 * FRAME + 0.02);

      // S4b: the iPad steps back beside the Mac, which never changed
      tl.to("#ipad", { ...IPAD, duration: 0.7, ease: "power2.inOut" }, 12.5);
      tl.to("#phone", { x: PHONE.x, duration: 0.85, ease: "expo.out" }, 12.7);

      // S5: the three screens settle under the name
      tl.to("#world", { ...END, duration: 0.8, ease: "power2.inOut" }, 14.8);

      window.__timelines["film"] = tl;
    })();
  </script>
